<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中1歴史 定期考査対策ゲーム 完全版</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:#f4f6fa;margin:0;color:#222}
.wrap{max-width:820px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(0,0,0,.08);margin-bottom:16px}
h1{font-size:26px;margin-top:0} h2{font-size:22px}
button,input,select{font:inherit}
input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;margin:7px 0 14px}
button{border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
.primary{background:#2457d6;color:#fff} .secondary{background:#e8ebf0}
.choice{display:block;width:100%;text-align:left;background:#f3f4f6;margin:9px 0;padding:14px}
.choice.sel{outline:3px solid #2457d6;background:#edf3ff}
.hidden{display:none}
.barbox{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden} .bar{height:100%;background:#2457d6}
.big{font-size:46px;font-weight:800} .good{color:#137333;font-weight:700} .bad{color:#b3261e;font-weight:700}
.small{font-size:13px;color:#666} .pill{display:inline-block;padding:5px 9px;background:#eef2ff;border-radius:999px;font-size:12px;margin-right:5px}
.modehelp{background:#f7f8fb;border-radius:12px;padding:12px;margin:8px 0 15px;line-height:1.6}
.sort-card{background:#f7f8fb;border:2px solid #dbe1ea;border-radius:14px;padding:14px;margin:10px 0;touch-action:none;user-select:none}
.sort-row{display:flex;align-items:center;gap:10px}
.drag{font-size:22px;cursor:grab}
.year-hidden{font-size:12px;color:#777}
.sort-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body><div class="wrap">

<div class="card" id="start">
<h1>中1歴史 定期考査対策ゲーム</h1>
<p>授業プリント No.11〜13・ワーク p.16〜25</p>
<label>名前</label>
<input id="name" placeholder="名前を入力">

<label>使い方</label>
<select id="quizType" onchange="updateModeHelp()">
<option value="study">覚えるクイズ</option>
<option value="test">テストクイズ</option>
<option value="timeline">時系列クイズ</option>
<option value="timelineSort">時系列・並び替えゲーム</option>
</select>
<div id="modeHelp" class="modehelp"></div>

<label id="countLabel">問題数</label>
<select id="mode">
<option value="10">10問</option>
<option value="20">20問</option>
<option value="30">30問</option>
<option value="all">全問</option>
</select>

<button class="primary" onclick="startQuiz()">スタート</button>
</div>

<div class="card hidden" id="quiz">
<div class="barbox"><div class="bar" id="bar" style="width:0%"></div></div>
<p class="small" id="count"></p>
<span class="pill" id="topic"></span>
<h2 id="q"></h2>
<div id="choices"></div>
<div id="feedback" class="hidden" style="margin-top:16px;padding:16px;border-radius:12px;font-size:18px;font-weight:700"></div>
<button id="nextBtn" class="primary" onclick="nextQ()" disabled style="opacity:.5">次へ</button>
</div>

<div class="card hidden" id="sortQuiz">
<div class="barbox"><div class="bar" id="sortBar" style="width:0%"></div></div>
<p class="small" id="sortCount"></p>
<span class="pill">時系列・並び替え</span>
<h2 id="sortPrompt"></h2>
<p class="small">▲▼ボタンでカードを上下に動かしてください。上が古く、下が新しい順です。</p>
<div id="sortList"></div>
<div id="sortFeedback" class="hidden" style="margin-top:16px;padding:16px;border-radius:12px;font-size:18px;font-weight:700"></div>
<div class="sort-actions">
<button class="primary" id="checkSortBtn" onclick="checkSort()">答え合わせ</button>
<button class="secondary hidden" id="nextSortBtn" onclick="nextSort()">次へ</button>
</div>
</div>

<div class="card hidden" id="result">
<h2>結果</h2>
<div class="big" id="score"></div>
<p id="msg"></p>
<p><b>正解数：</b><span id="correct"></span></p>
<h3>間違えた問題</h3>
<div id="review"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
<button class="primary" id="retryBtn" onclick="retryWrong()">間違えた問題だけ再挑戦</button>
<button class="secondary" onclick="location.reload()">最初から</button>
</div>
<p class="small" id="sendStatus">全問終了後、成績は自動送信されます。</p>
</div>

</div>

": "九州に置かれ外交や軍事を担当した役所は？", "c": ["勘合貿易", "書院造", "太宰府", "江戸幕府"], "a": 2, "e": "正解は「太宰府」です。", "topic": "重要語句"}, {"q": "東西を結ぶ交易路は？", "c": ["水墨画", "シルクロード", "勘合貿易", "書院造"], "a": 1, "e": "正解は「シルクロード」です。", "topic": "重要語句"}, {"q": "唐に派遣された使節は？", "c": ["遣唐使", "書院造", "水墨画", "法隆寺"], "a": 0, "e": "正解は「遣唐使」です。", "topic": "重要語句"}, {"q": "唐から来日し日本に戒律を伝えた僧は？", "c": ["水墨画", "法隆寺", "長岡京", "鑑真"], "a": 3, "e": "正解は「鑑真」です。", "topic": "重要語句"}, {"q": "聖武天皇が国ごとに建立させた寺院は？", "c": ["長岡京", "院政", "国分寺・国分尼寺", "法隆寺"], "a": 2, "e": "正解は「国分寺・国分尼寺」です。", "topic": "重要語句"}, {"q": "聖武天皇が大仏を造立させた寺は？", "c": ["武家政治", "東大寺", "長岡京", "院政"], "a": 1, "e": "正解は「東大寺」です。", "topic": "重要語句"}, {"q": "奈良時代の国際色豊かな文化は？", "c": ["天平文化", "院政", "武家政治", "御成敗式目"], "a": 0, "e": "正解は「天平文化」です。", "topic": "重要語句"}, {"q": "東大寺にある国際色豊かな宝物を納めた建物は？", "c": ["武家政治", "御成敗式目", "参勤交代", "正倉院"], "a": 3, "e": "正解は「正倉院」です。", "topic": "重要語句"}, {"q": "794年に平安京へ遷都した天皇は？", "c": ["参勤交代", "鎌倉幕府", "桓武天皇", "御成敗式目"], "a": 2, "e": "正解は「桓武天皇」です。", "topic": "重要語句"}, {"q": "794年に都が移された場所は？", "c": ["室町幕府", "平安京", "参勤交代", "鎌倉幕府"], "a": 1, "e": "正解は「平安京」です。", "topic": "重要語句"}, {"q": "征夷大将軍として東北地方に派遣された人物は？", "c": ["坂上田村麻呂", "鎌倉幕府", "室町幕府", "江戸幕府"], "a": 0, "e": "正解は「坂上田村麻呂」です。", "topic": "重要語句"}, {"q": "東北地方で朝廷に抵抗した人々は？", "c": ["室町幕府", "江戸幕府", "勘合貿易", "蝦夷"], "a": 3, "e": "正解は「蝦夷」です。", "topic": "重要語句"}, {"q": "比叡山延暦寺を開き天台宗を広めた僧は？", "c": ["勘合貿易", "書院造", "最澄", "江戸幕府"], "a": 2, "e": "正解は「最澄」です。", "topic": "重要語句"}, {"q": "最澄が広めた宗派は？", "c": ["水墨画", "天台宗", "勘合貿易", "書院造"], "a": 1, "e": "正解は「天台宗」です。", "topic": "重要語句"}, {"q": "高野山金剛峯寺を開き真言宗を広めた僧は？", "c": ["空海", "書院造", "水墨画", "法隆寺"], "a": 0, "e": "正解は「空海」です。", "topic": "重要語句"}, {"q": "空海が広めた宗派は？", "c": ["水墨画", "法隆寺", "長岡京", "真言宗"], "a": 3, "e": "正解は「真言宗」です。", "topic": "重要語句"}, {"q": "894年、遣唐使の停止を提案した人物は？", "c": ["長岡京", "院政", "菅原道真", "法隆寺"], "a": 2, "e": "正解は「菅原道真」です。", "topic": "重要語句"}, {"q": "遣唐使停止後、日本の風土や生活に合って発達した文化は？", "c": ["武家政治", "国風文化", "長岡京", "院政"], "a": 1, "e": "正解は「国風文化」です。", "topic": "重要語句"}, {"q": "幼い天皇を補佐 const TIMELINE=[{"q": "次の出来事を古い順に並べたものはどれ？", "c": ["大宝律令 → 平城京 → 墾田永年私財法 → 平安京", "平城京 → 大宝律令 → 平安京 → 墾田永年私財法", "大宝律令 → 墾田永年私財法 → 平城京 → 平安京", "平安京 → 平城京 → 大宝律令 → 墾田永年私財法"], "a": 0, "e": "701年 大宝律令 → 710年 平城京 → 743年 墾田永年私財法 → 794年 平安京の順です。", "topic": "時系列"}, {"q": "701年に起きた出来事は？", "c": ["大宝律令が制定された", "平城京に都が移された", "墾田永年私財法が出された", "平安京に都が移された"], "a": 0, "e": "701年に大宝律令が制定されました。", "topic": "時系列"}, {"q": "710年に起きた出来事は？", "c": ["平城京に都が移された", "大宝律令が制定された", "平安京に都が移された", "遣唐使が停止された"], "a": 0, "e": "710年に平城京がつくられました。", "topic": "時系列"}, {"q": "743年に出された法は？", "c": ["墾田永年私財法", "大宝律令", "三世一身法", "班田収授法"], "a": 0, "e": "743年に墾田永年私財法が出されました。", "topic": "時系列"}, {"q": "794年に起きた出来事は？", "c": ["平安京に都が移された", "平城京に都が移された", "遣唐使が停止された", "墾田永年私財法が出された"], "a": 0, "e": "794年、桓武天皇が平安京へ都を移しました。", "topic": "時系列"}, {"q": "894年に関係する出来事は？", "c": ["遣唐使の停止が提案された", "平安京に都が移された", "大宝律令が制定された", "平城京に都が移された"], "a": 0, "e": "894年、菅原道真が遣唐使の停止を提案しました。", "topic": "時系列"}, {"q": "次のうち最も古い出来事は？", "c": ["大宝律令の制定", "平城京への遷都", "平安京への遷都", "遣唐使停止の提案"], "a": 0, "e": "大宝律令は701年で、この中では最も古い出来事です。", "topic": "時系列"}, {"q": "次のうち最も新しい出来事は？", "c": ["遣唐使停止の提案", "大宝律令の制定", "平城京への遷都", "平安京への遷都"], "a": 0, "e": "遣唐使停止の提案は894年で、この中では最も新しい出来事です。", "topic": "時系列"}, {"q": "平城京への遷都の次に起きた出来事として最も近いものは？", "c": ["墾田永年私財法", "平安京への遷都", "遣唐使停止の提案", "摂関政治の最盛期"], "a": 0, "e": "710年の平城京の後、743年に墾田永年私財法が出されました。", "topic": "時系列"}, {"q": "平安京への遷都より前に起きた出来事は？", "c": ["墾田永年私財法", "遣唐使停止の提案", "国風文化の発達", "藤原道長の摂関政治"], "a": 0, "e": "墾田永年私財法は743年、平安京への遷都は794年です。", "topic": "時系列"}, {"q": "平安京への遷都より後に起きた出来事は？", "c": ["遣唐使停止の提案", "大宝律令の制定", "平城京への遷都", "墾田永年私財法"], "a": 0, "e": "平安京への遷都は794年、遣唐使停止の提案は894年です。", "topic": "時系列"}, {"q": "次の組み合わせで、年代の順序が正しいものは？", "c": ["平城京 → 平安京 → 遣唐使停止", "平安京 → 平城京 → 遣唐使停止", "遣唐使停止 → 平城京 → 平安京", "平城京 → 遣唐使停止 → 平安京"], "a": 0, "e": "710年 平城京 → 794年 平安京 → 894年 遣唐使停止の順です。", "topic": "時系列"}];
const SORTSETS=[{"prompt": "次の出来事を古い順に並べてください。", "items": [{"label": "大宝律令の制定", "year": 701}, {"label": "平城京への遷都", "year": 710}, {"label": "墾田永年私財法", "year": 743}, {"label": "平安京への遷都", "year": 794}]}, {"prompt": "次の出来事を古い順に並べてください。", "items": [{"label": "平城京への遷都", "year": 710}, {"label": "墾田永年私財法", "year": 743}, {"label": "平安京への遷都", "year": 794}, {"label": "遣唐使停止の提案", "year": 894}]}, {"prompt": "次の出来事を古い順に並べてください。", "items": [{"label": "大宝律令の制定", "year": 701}, {"label": "墾田永年私財法", "year": 743}, {"label": "平安京への遷都", "year": 794}, {"label": "遣唐使停止の提案", "year": 894}]}];
const ENDPOINT="https://script.google.com/macros/s/AKfycbxxBGR0zMSx34cOws9dt7la53wo9ufEnY5_J3tKoQ6u7iI7y6N3pvbc2T6N0CUv1hJl/exec";
const el=id=>document.getElementById(id);

let qs=[],idx=0,selected=null,answers=[],startedAt=null,lastWrong=[],sentForAttempt=false,currentType="study";
let sortSets=[],sortIdx=0,sortCorrect=0,sortWrong=[];

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function updateModeHelp(){
 const t=el("quizType").value;
 if(t==="study"){
   el("modeHelp").innerHTML="<b>覚えるクイズ：</b>答えた瞬間に○×・正解・解説を表示します。暗記するとき向けです。";
   el("countLabel").style.display="block";el("mode").style.display="block";
 } else if(t==="test"){
   el("modeHelp").innerHTML="<b>テストクイズ：</b>途中では正解を表示しません。最後にまとめて採点します。本番確認向けです。";
   el("countLabel").style.display="block";el("mode").style.display="block";
 } else if(t==="timeline"){
   el("modeHelp").innerHTML="<b>時系列クイズ：</b>年代・出来事の前後関係・古い順を4択で練習します。";
   el("countLabel").style.display="none";el("mode").style.display="none";
 } else {
   el("modeHelp").innerHTML="<b>時系列・並び替えゲーム：</b>出来事カードを自分で古い順に並べます。時代の流れを覚える練習向けです。";
   el("countLabel").style.display="none";el("mode").style.display="none";
 }
}

function startQuiz(){
 const n=el("name").value.trim();
 if(!n){alert("名前を入力してください");return}
 currentType=el("quizType").value;
 startedAt=new Date();sentForAttempt=false;
 el("start").classList.add("hidden");
 el("result").classList.add("hidden");

 if(currentType==="timelineSort"){
   sortSets=shuffle(SORTSETS);
   sortIdx=0;sortCorrect=0;sortWrong=[];
   el("sortQuiz").classList.remove("hidden");
   renderSort();
   return;
 }

 el("quiz").classList.remove("hidden");
 if(currentType==="timeline")qs=shuffle(TIMELINE);
 else {
   qs=shuffle(ALL);
   const m=el("mode").value;
   if(m!=="all")qs=qs.slice(0,Number(m));
 }
 idx=0;selected=null;answers=[];lastWrong=[];
 render();
}

function render(){
 selected=null;
 const x=qs[idx];
 el("count").textContent=`第${idx+1}問 / ${qs.length}問`;
 el("topic").textContent=x.topic;
 el("q").textContent=x.q;
 el("bar").style.width=`${idx/qs.length*100}%`;
 const box=el("choices");box.innerHTML="";
 const fb=el("feedback");fb.classList.add("hidden");fb.innerHTML="";
 const nb=el("nextBtn");nb.disabled=true;nb.style.opacity=".5";

 x.c.forEach((t,i)=>{
   const b=document.createElement("button");
   b.className="choice";b.textContent=`${String.fromCharCode(65+i)}. ${t}`;
   b.onclick=()=>answerQuestion(i,b);
   box.appendChild(b);
 });
}

function answerQuestion(i,button){
 if(selected!==null)return;
 selected=i;answers.push(i);
 const x=qs[idx];
 document.querySelectorAll(".choice").forEach(btn=>btn.disabled=true);
 button.classList.add("sel");

 if(currentType==="study" || currentType==="timeline"){
   document.querySelectorAll(".choice").forEach((btn,j)=>{
     if(j===x.a){btn.style.background="#e8f5e9";btn.style.outline="3px solid #2e7d32"}
     if(j===i && i!==x.a){btn.style.background="#ffebee";btn.style.outline="3px solid #c62828"}
   });
   const fb=el("feedback");fb.classList.remove("hidden");
   if(i===x.a){
     fb.style.background="#e8f5e9";fb.style.color="#166534";
     fb.innerHTML=`<div style="font-size:28px">○ 正解！</div><div>正解：${x.c[x.a]}</div><div class="small" style="color:#166534">${x.e}</div>`;
   } else {
     fb.style.background="#ffebee";fb.style.color="#b91c1c";
     fb.innerHTML=`<div style="font-size:28px">× 不正解</div><div>正解：${x.c[x.a]}</div><div class="small" style="color:#b91c1c">${x.e}</div>`;
   }
 } else {
   const fb=el("feedback");fb.classList.remove("hidden");
   fb.style.background="#eef2ff";fb.style.color="#334155";
   fb.textContent="回答を記録しました。正解はテスト終了後に表示します。";
 }
 el("nextBtn").disabled=false;el("nextBtn").style.opacity="1";
}

function nextQ(){idx++;if(idx<qs.length)render();else showResult();}

function renderSort(){
 const s=sortSets[sortIdx];
 el("sortCount").textContent=`第${sortIdx+1}問 / ${sortSets.length}問`;
 el("sortBar").style.width=`${sortIdx/sortSets.length*100}%`;
 el("sortPrompt").textContent=s.prompt;
 el("sortFeedback").classList.add("hidden");
 el("checkSortBtn").classList.remove("hidden");
 el("nextSortBtn").classList.add("hidden");

 s.current=shuffle(s.items);
 renderSortCurrentOnly();
}

function moveSort(from,to){
 const s=sortSets[sortIdx];
 if(to<0 || to>=s.current.length || from===to) return;
 const [moved]=s.current.splice(from,1);
 s.current.splice(to,0,moved);
 renderSortCurrentOnly();
}

function renderSortCurrentOnly(){
 const s=sortSets[sortIdx];
 const list=el("sortList");
 list.innerHTML="";

 s.current.forEach((item,i)=>{
   const d=document.createElement("div");
   d.className="sort-card";
   d.innerHTML=`
     <div class="sort-row">
       <div><b>${item.label}</b></div>
       <div class="move-buttons">
         <button class="move-btn" ${i===0?"disabled":""} onclick="moveSort(${i},${i-1})">▲</button>
         <button class="move-btn" ${i===s.current.length-1?"disabled":""} onclick="moveSort(${i},${i+1})">▼</button>
       </div>
     </div>`;
   list.appendChild(d);
 });
}

function checkSort(){
 const s=sortSets[sortIdx];
 const correctOrder=[...s.items].sort((a,b)=>a.year-b.year);
 const ok=s.current.every((x,i)=>x.label===correctOrder[i].label);

 if(ok)sortCorrect++;
 else sortWrong.push({prompt:s.prompt,yours:s.current.map(x=>x.label).join(" → "),correct:correctOrder.map(x=>`${x.year}年 ${x.label}`).join(" → ")});

 const fb=el("sortFeedback");fb.classList.remove("hidden");
 if(ok){
   fb.style.background="#e8f5e9";fb.style.color="#166534";
   fb.innerHTML=`<div style="font-size:28px">○ 正解！</div><div class="small" style="color:#166534">${correctOrder.map(x=>`${x.year}年 ${x.label}`).join(" → ")}</div>`;
 } else {
   fb.style.background="#ffebee";fb.style.color="#b91c1c";
   fb.innerHTML=`<div style="font-size:28px">× 不正解</div><div style="margin-top:6px">正しい順：</div><div class="small" style="color:#b91c1c">${correctOrder.map(x=>`${x.year}年 ${x.label}`).join(" → ")}</div>`;
 }
 el("checkSortBtn").classList.add("hidden");
 el("nextSortBtn").classList.remove("hidden");
}

function nextSort(){
 sortIdx++;
 if(sortIdx<sortSets.length)renderSort();
 else showSortResult();
}

function showSortResult(){
 el("sortQuiz").classList.add("hidden");
 el("result").classList.remove("hidden");
 const total=sortSets.length;
 const s=Math.round(sortCorrect/total*100);
 el("score").textContent=s+"点";
 el("correct").textContent=`${sortCorrect} / ${total}`;
 el("msg").textContent=s>=90?"時代の流れがかなりつかめています！":s>=70?"よくできています。もう一度並べると定着します。":"年代の並びをもう一度確認しよう。";
 el("retryBtn").style.display="none";
 el("review").innerHTML=sortWrong.length?sortWrong.map((w,i)=>`<div style="padding:12px;margin:10px 0;background:#fff7f7;border-radius:10px"><div class="bad">並び替え ${i+1}</div><div>あなたの順：${w.yours}</div><div class="good">正しい順：${w.correct}</div></div>`).join(""):'<p class="good">全問正解！</p>';
 sendResult();
}

function showResult(){
 el("quiz").classList.add("hidden");el("result").classList.remove("hidden");
 let ok=0;lastWrong=[];
 qs.forEach((x,i)=>{if(answers[i]===x.a)ok++;else lastWrong.push({...x,no:i+1,yours:x.c[answers[i]]})});
 const s=Math.round(ok/qs.length*100);
 el("score").textContent=s+"点";el("correct").textContent=`${ok} / ${qs.length}`;
 el("msg").textContent=s>=90?"かなり仕上がっています！":s>=70?"よくできています。間違い直しでさらに伸ばそう。":"間違えた問題を重点的に復習しよう。";
 el("retryBtn").style.display="inline-block";
 el("review").innerHTML=lastWrong.length?lastWrong.map(w=>`<div style="padding:12px;margin:10px 0;background:#fff7f7;border-radius:10px"><div class="bad">第${w.no}問（${w.topic}）</div><div>${w.q}</div><div>あなたの答え：${w.yours}</div><div class="good">正解：${w.c[w.a]}</div><div class="small">${w.e}</div></div>`).join(""):'<p class="good">全問正解！</p>';
 sendResult();
}

function retryWrong(){
 if(!lastWrong.length){alert("間違いはありません！");return}
 qs=shuffle(lastWrong.map(w=>({q:w.q,c:w.c,a:w.a,e:w.e,topic:w.topic})));
 idx=0;selected=null;answers=[];lastWrong=[];sentForAttempt=false;startedAt=new Date();currentType="study";
 el("result").classList.add("hidden");el("quiz").classList.remove("hidden");render();
}

function buildData(){
 if(currentType==="timelineSort"){
   return {studentName:el("name").value.trim(),subject:"歴史・時系列並び替え",score:Math.round(sortCorrect/sortSets.length*100),correct:sortCorrect,total:sortSets.length,wrongQuestions:sortWrong.map((_,i)=>i+1).join(","),weakTopics:"時系列",startedAt:startedAt?startedAt.toISOString():"",finishedAt:new Date().toISOString()};
 }
 let ok=0,wn=[],tp={};
 qs.forEach((x,i)=>{if(answers[i]===x.a)ok++;else{wn.push(i+1);tp[x.topic]=(tp[x.topic]||0)+1}});
 const typeName=currentType==="study"?"覚えるクイズ":currentType==="test"?"テストクイズ":"時系列クイズ";
 return {studentName:el("name").value.trim(),subject:"歴史・"+typeName,score:Math.round(ok/qs.length*100),correct:ok,total:qs.length,wrongQuestions:wn.join(","),weakTopics:Object.entries(tp).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).join(","),startedAt:startedAt?startedAt.toISOString():"",finishedAt:new Date().toISOString()};
}

async function sendResult(){
 if(sentForAttempt)return;sentForAttempt=true;
 const status=el("sendStatus");
 try{
   status.textContent="成績を自動送信中…";
   await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(buildData())});
   status.textContent="成績は管理者へ自動送信されました。";
 }catch(e){sentForAttempt=false;status.textContent="成績の自動送信に失敗しました。"}
}

updateModeHelp();
</script></body></html>
