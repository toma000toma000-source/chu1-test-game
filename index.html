<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中1歴史 定期考査対策ゲーム 完全版</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:#f4f6fa;margin:0;color:#222;padding-bottom:92px}
.wrap{max-width:820px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(0,0,0,.08);margin-bottom:16px}
h1{font-size:26px;margin-top:0} h2{font-size:22px}
button,input,select{font:inherit}
input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;margin:7px 0 14px}
button{border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
.primary{background:#2457d6;color:#fff} .secondary{background:#e8ebf0}
.choice{display:block;width:100%;text-align:left;background:#f3f4f6;margin:9px 0;padding:14px}
.choice.sel{outline:3px solid #2457d6;background:#edf3ff}
.hidden{display:none}
.barbox{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden} .bar{height:100%;background:#2457d6}
.big{font-size:46px;font-weight:800} .good{color:#137333;font-weight:700} .bad{color:#b3261e;font-weight:700}
.small{font-size:13px;color:#666} .pill{display:inline-block;padding:5px 9px;background:#eef2ff;border-radius:999px;font-size:12px;margin-right:5px}
.modehelp{background:#f7f8fb;border-radius:12px;padding:12px;margin:8px 0 15px;line-height:1.6}
.sort-card{background:#f7f8fb;border:2px solid #dbe1ea;border-radius:14px;padding:14px;margin:10px 0;touch-action:none;user-select:none}
.sort-row{display:flex;align-items:center;gap:10px}
.drag{font-size:22px;cursor:grab}
.year-hidden{font-size:12px;color:#777}
.sort-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

#nextBtn{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:14px;
  width:min(92vw,760px);
  z-index:999;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
  font-size:18px;
  padding:14px 18px;
}
@supports (padding: max(0px)){
  #nextBtn{bottom:max(14px, env(safe-area-inset-bottom));}
}

</style>
</head>
<body><div class="wrap">

<div class="card" id="start">
<h1>中1歴史 定期考査対策ゲーム</h1>
<p>授業プリント No.11〜13・ワーク p.16〜25</p>
<label>名前</label>
<input id="name" placeholder="名前を入力">

<label>使い方</label>
<select id="quizType" onchange="updateModeHelp()">
<option value="study">覚えるクイズ</option>
<option value="test">テストクイズ</option>
<option value="timeline">時系列クイズ</option>
<option value="timelineSort">時系列・並び替えゲーム</option>
</select>
<div id="modeHelp" class="modehelp"></div>

<label id="countLabel">問題数</label>
<select id="mode">
<option value="10">10問</option>
<option value="20">20問</option>
<option value="30">30問</option>
<option value="all">全問</option>
</select>

<button class="primary" onclick="startQuiz()">スタート</button>
</div>

<div class="card hidden" id="quiz">
<div class="barbox"><div class="bar" id="bar" style="width:0%"></div></div>
<p class="small" id="count"></p>
<span class="pill" id="topic"></span>
<h2 id="q"></h2>
<div id="choices"></div>
<div id="feedback" class="hidden" style="margin-top:16px;padding:16px;border-radius:12px;font-size:18px;font-weight:700"></div>
<button id="nextBtn" class="primary" onclick="nextQ()" disabled style="opacity:.5">次へ</button>
</div>

<div class="card hidden" id="sortQuiz">
<div class="barbox"><div class="bar" id="sortBar" style="width:0%"></div></div>
<p class="small" id="sortCount"></p>
<span class="pill">時系列・並び替え</span>
<h2 id="sortPrompt"></h2>
<p class="small">▲▼ボタンでカードを上下に動かしてください。上が古く、下が新しい順です。</p>
<div id="sortList"></div>
<div id="sortFeedback" class="hidden" style="margin-top:16px;padding:16px;border-radius:12px;font-size:18px;font-weight:700"></div>
<div class="sort-actions">
<button class="primary" id="checkSortBtn" onclick="checkSort()">答え合わせ</button>
<button class="secondary hidden" id="nextSortBtn" onclick="nextSort()">次へ</button>
</div>
</div>

<div class="card hidden" id="result">
<h2>結果</h2>
<div class="big" id="score"></div>
<p id="msg"></p>
<p><b>正解数：</b><span id="correct"></span></p>
<h3>間違えた問題</h3>
<div id="review"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
<button class="primary" id="retryBtn" onclick="retryWrong()">間違えた問題だけ再挑戦</button>
<button class="secondary" onclick="location.reload()">最初から</button>
</div>
<p class="small" id="sendStatus">全問終了後、成績は自動送信されます。</p>
</div>

</div>
<script>
const ALL=[{"q": "土地と人民を国家が支配する考えは？", "c": ["公地公民", "班田収授法", "荘園制", "摂関政治"], "a": 0, "e": "土地と人民を国家が支配する考え方を公地公民といいます。", "topic": "律令国家"}, {"q": "人々を登録し、口分田や税の基礎にした台帳は？", "c": ["計帳", "系図", "国絵図", "戸籍"], "a": 3, "e": "人々を登録し、口分田の支給や税の基礎にしたのが戸籍です。", "topic": "律令国家"}, {"q": "701年に制定された律令は？", "c": ["十七条の憲法", "墾田永年私財法", "大宝律令", "養老律令"], "a": 2, "e": "701年に大宝律令が制定されました。", "topic": "律令国家"}, {"q": "710年、唐の長安にならってつくられた都は？", "c": ["藤原京", "平城京", "平安京", "長岡京"], "a": 1, "e": "710年に平城京がつくられました。", "topic": "奈良時代"}, {"q": "平城京のモデルとなった唐の都は？", "c": ["長安", "洛陽", "南京", "開封"], "a": 0, "e": "平城京は唐の長安にならってつくられました。", "topic": "奈良時代"}, {"q": "奈良時代に使われた貨幣は？", "c": ["富本銭", "寛永通宝", "永楽通宝", "和同開珎"], "a": 3, "e": "奈良時代には和同開珎が使われました。", "topic": "奈良時代"}, {"q": "平城京で人々が品物を売買した場所は？", "c": ["郡家", "駅家", "市", "国府"], "a": 2, "e": "平城京には市が設けられ、売買が行われました。", "topic": "奈良時代"}, {"q": "班田収授法にもとづき人々に与えられた田は？", "c": ["公領", "口分田", "荘園", "墾田"], "a": 1, "e": "班田収授法にもとづき、口分田が与えられました。", "topic": "土地制度"}, {"q": "戸籍にもとづき口分田を班給した制度は？", "c": ["班田収授法", "墾田永年私財法", "三世一身法", "公地公民"], "a": 0, "e": "戸籍にもとづき口分田を班給した制度が班田収授法です。", "topic": "土地制度"}, {"q": "収穫量のおよそ3％の稲を納める税は？", "c": ["庸", "調", "雑徭", "租"], "a": 3, "e": "租は収穫量のおよそ3％の稲を納める税です。", "topic": "税制"}, {"q": "地方の特産物を納める税は？", "c": ["庸", "雑徭", "調", "租"], "a": 2, "e": "調は地方の特産物を納める税です。", "topic": "税制"}, {"q": "労役の代わりに布などを納める税は？", "c": ["雑徭", "庸", "租", "調"], "a": 1, "e": "庸は労役の代わりに布などを納める税です。", "topic": "税制"}, {"q": "国司のもとで一定日数働く労役は？", "c": ["雑徭", "租", "庸", "防人"], "a": 0, "e": "雑徭は国司のもとで課された労役です。", "topic": "税制"}, {"q": "九州北部の防衛につく兵役は？", "c": ["衛士", "雑徭", "国司", "防人"], "a": 3, "e": "防人は九州北部の防衛につく兵役です。", "topic": "税制"}, {"q": "都の警備などについた兵役は？", "c": ["雑徭", "国司", "衛士", "防人"], "a": 2, "e": "衛士は都の警備などを担当しました。", "topic": "税制"}, {"q": "新しく開墾した土地の私有を一定期間認めた法は？", "c": ["大宝律令", "三世一身法", "墾田永年私財法", "班田収授法"], "a": 1, "e": "三世一身法は新しく開墾した土地の私有を一定期間認めました。", "topic": "土地制度"}, {"q": "743年、開墾した土地の永久私有を認めた法は？", "c": ["墾田永年私財法", "三世一身法", "班田収授法", "大宝律令"], "a": 0, "e": "743年に墾田永年私財法が出されました。", "topic" let audioCtx=null;
function getAudioCtx(){
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx) return null;
  if(!audioCtx) audioCtx=new Ctx();
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq,start,duration,volume=0.12,type="sine"){
  const ctx=getAudioCtx();
  if(!ctx) return;
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,ctx.currentTime+start);
  gain.gain.setValueAtTime(0.0001,ctx.currentTime+start);
  gain.gain.exponentialRampToValueAtTime(volume,ctx.currentTime+start+0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+start+duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime+start);
  osc.stop(ctx.currentTime+start+duration+0.03);
}
function playCorrect(){
  tone(660,0,0.14,0.12,"sine");
  tone(880,0.15,0.18,0.12,"sine");
}
function playWrong(){
  tone(180,0,0.18,0.14,"square");
  tone(140,0.17,0.22,0.12,"square");
}

}

 else showSortResult();
}

function showSortResult(){
 el("sortQuiz").classList.add("hidden");
 el("result").classList.remove("hidden");
 const total=sortSets.length;
 const s=Math.round(sortCorrect/total*100);
 el("score").textContent=s+"点";
 el("correct").textContent=`${sortCorrect} / ${total}`;
 el("msg").textContent=s>=90?"時代の流れがかなりつかめています！":s>=70?"よくできています。もう一度並べると定着します。":"年代の並びをもう一度確認しよう。";
 el("retryBtn").style.display="none";
 el("review").innerHTML=sortWrong.length?sortWrong.map((w,i)=>`<div style="padding:12px;margin:10px 0;background:#fff7f7;border-radius:10px"><div class="bad">並び替え ${i+1}</div><div>あなたの順：${w.yours}</div><div class="good">正しい順：${w.correct}</div></div>`).join(""):'<p class="good">全問正解！</p>';
 sendResult();
}

function showResult(){
 el("quiz").classList.add("hidden");el("result").classList.remove("hidden");
 let ok=0;lastWrong=[];
 qs.forEach((x,i)=>{if(answers[i]===x.a)ok++;else lastWrong.push({...x,no:i+1,yours:x.c[answers[i]]})});
 const s=Math.round(ok/qs.length*100);
 el("score").textContent=s+"点";el("correct").textContent=`${ok} / ${qs.length}`;
 el("msg").textContent=s>=90?"かなり仕上がっています！":s>=70?"よくできています。間違い直しでさらに伸ばそう。":"間違えた問題を重点的に復習しよう。";
 el("retryBtn").style.display="inline-block";
 el("review").innerHTML=lastWrong.length?lastWrong.map(w=>`<div style="padding:12px;margin:10px 0;background:#fff7f7;border-radius:10px"><div class="bad">第${w.no}問（${w.topic}）</div><div>${w.q}</div><div>あなたの答え：${w.yours}</div><div class="good">正解：${w.c[w.a]}</div><div class="small">${w.e}</div></div>`).join(""):'<p class="good">全問正解！</p>';
 sendResult();
}

function retryWrong(){
 if(!lastWrong.length){alert("間違いはありません！");return}
 qs=shuffle(lastWrong.map(w=>({q:w.q,c:w.c,a:w.a,e:w.e,topic:w.topic})));
 idx=0;selected=null;answers=[];lastWrong=[];sentForAttempt=false;startedAt=new Date();currentType="study";
 el("result").classList.add("hidden");el("quiz").classList.remove("hidden");render();
}

function buildData(){
 if(currentType==="timelineSort"){
   return {studentName:el("name").value.trim(),subject:"歴史・時系列並び替え",score:Math.round(sortCorrect/sortSets.length*100),correct:sortCorrect,total:sortSets.length,wrongQuestions:sortWrong.map((_,i)=>i+1).join(","),weakTopics:"時系列",startedAt:startedAt?startedAt.toISOString():"",finishedAt:new Date().toISOString()};
 }
 let ok=0,wn=[],tp={};
 qs.forEach((x,i)=>{if(answers[i]===x.a)ok++;else{wn.push(i+1);tp[x.topic]=(tp[x.topic]||0)+1}});
 const typeName=currentType==="study"?"覚えるクイズ":currentType==="test"?"テストクイズ":"時系列クイズ";
 return {studentName:el("name").value.trim(),subject:"歴史・"+typeName,score:Math.round(ok/qs.length*100),correct:ok,total:qs.length,wrongQuestions:wn.join(","),weakTopics:Object.entries(tp).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).join(","),startedAt:startedAt?startedAt.toISOString():"",finishedAt:new Date().toISOString()};
}

async function sendResult(){
 if(sentForAttempt)return;sentForAttempt=true;
 const status=el("sendStatus");
 try{
   status.textContent="成績を自動送信中…";
   await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(buildData())});
   status.textContent="成績は管理者へ自動送信されました。";
 }catch(e){sentForAttempt=false;status.textContent="成績の自動送信に失敗しました。"}
}

updateModeHelp();
</script></body></html>
